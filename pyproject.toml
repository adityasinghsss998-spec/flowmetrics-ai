[project]
name = "flowmetrics-ai"
version = "0.1.0"
description = "FlowMetrics AI Service"
requires-python = ">=3.11"

[tool.pyright]
include = ["src", "."]
extraPaths = ["src", "."]
venvPath = "."
venv = ".venv"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.ruff.lint]
ignore = ["BLE001"]

